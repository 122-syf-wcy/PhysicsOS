# Install separately from the system vhost after obtaining this host's certificate.
# The system application and admin APIs remain on physics.dongsiwei.com.
server {
    listen 80;
    listen [::]:80;
    server_name physicsos.dongsiwei.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://physicsos.dongsiwei.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name physicsos.dongsiwei.com;
    ssl_certificate /etc/letsencrypt/live/physicsos.dongsiwei.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/physicsos.dongsiwei.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    client_max_body_size 32m;
    # Node's URL parser normalizes backslashes differently from Nginx.
    if ($uri ~ "\\\\") { return 400; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;

    location = / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3080/physicsos/website/index.html;
    }
    location ^~ /physicsos/website/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3080;
    }
    location = /physicsos/notice/public/website {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3080;
    }
    location = /physicsos/notice/public/website-feedback {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3080;
    }
    location / { return 404; }
}
