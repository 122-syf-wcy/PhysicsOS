# SearXNG settings for the PhysicsOS research tool.
#
# Private instance: no public access, JSON output enabled for the app only.
# The JSON API is what `@physicsos/web-research`'s adapter calls; without
# `formats: [html, json]` SearXNG answers 403 for format=json.
#
# Engines are intentionally a small, explicit set. They are upstream sources
# SearXNG aggregates; this instance owns no web index, and upstream engines can
# rate-limit or change, which the adapter reports honestly instead of turning
# into "no results".
use_default_settings: true

general:
  instance_name: 'PhysicsOS Research'
  enable_metrics: false
  # Required by the wikipedia/wikidata/openstreetmap engines; without it they
  # refuse to register at startup. This instance is private, so it is the
  # operator's contact, not a public one.
  contact_url: 'https://physics.dongsiwei.com'

server:
  bind_address: '0.0.0.0'
  port: 8080
  limiter: false
  public_instance: false
  # Replaced at deploy time by PHYSICSOS_SEARXNG_SECRET; the literal here only
  # keeps a bare local run bootable.
  secret_key: 'change-in-deployment'
  image_proxy: false

search:
  safe_search: 1
  autocomplete: ''
  default_lang: 'zh-CN'
  formats:
    - html
    - json

ui:
  static_use_hash: true

# Keep only engines that answer without an API key and return usable results
# for Chinese physics queries. Measured on the production host (2026-11-15)
# with 贵州高考物理真题:
#   duckduckgo 10/10 relevant, startpage 20 relevant, brave 16 relevant
#   bing 0, baidu 0, google 0 (blocked/empty from this host), qwant 0
# so the three working ones are enabled and the rest stay off. Anything
# requiring credentials also stays off; a deployment that adds one documents
# it here rather than enabling it silently.
engines:
  - name: duckduckgo
    disabled: false
  - name: startpage
    disabled: false
  - name: brave
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  - name: bing
    disabled: true
  - name: baidu
    disabled: true
  - name: google
    disabled: true
