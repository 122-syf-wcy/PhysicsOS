<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="/dist/assets/icon.svg"><title>PhysicsOS 实验文件独立预览</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.8 system-ui,sans-serif;background:#fafaf7;color:#34473c}header,main{max-width:1200px;margin:auto;padding:25px}h1{margin:7px 0;font-size:27px;font-weight:550}p{color:#7b897a;font-size:12px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 240px;border:1px solid #e2e7da;border-radius:10px;overflow:hidden;background:#fff}iframe{width:100%;height:460px;border:0;background:#f7f5ed}aside{padding:24px;border-left:1px solid #e2e7da}label{display:block;margin:15px 0;font-size:12px}input{width:100%;border:1px solid #dbe4d4;border-radius:5px;padding:9px;margin:6px 0;background:#fffdf9;color:#40583e}button{border:1px solid #c6d6bc;border-radius:5px;background:#edf4e7;color:#5d7b4d;padding:9px 12px;cursor:pointer}.badge{font-size:11px;color:#946f37;background:#faf2df;padding:7px 13px;border-radius:6px;display:inline-block}#readout{padding:15px;border:1px solid #e3eadb;background:#f5f9ef;font-size:12px}@media(max-width:650px){.grid{display:block}aside{border-left:0}iframe{height:330px}}
</style></head><body><header><span class="badge">独立模板预览 · 不连接生产账号</span><h1>凸透镜实验文件</h1><p>参数与计算由开发宿主提供；实验包只接收快照并显示三维。此处的解析计算用于调试，不是正式平台验证。拖动空白可旋转视角。</p></header><main><div class="grid"><iframe title="隔离的三维实验" sandbox="allow-scripts"></iframe><aside><strong>宿主参数面板</strong><label>物距 / cm<input name="objectDistanceCm" type="number" min="5" max="60" step="0.5"></label><label>焦距 / cm<input name="focalLengthCm" type="number" min="5" max="20" step="0.5"></label><label>光屏位置 / cm<input name="screenDistanceCm" type="number" min="5" max="80" step="0.5"></label><button id="reload">重新载入实验文件</button></aside></div><p id="readout"></p><p>完成开发后运行 npm run check、npm run build、npm run pack。交付 release 目录里的 ZIP；无需修改 PhysicsOS 主仓库。正式站点上传与审核接入仍待完成。</p></main><script type="module" src="/preview/host.js"></script></body></html>
