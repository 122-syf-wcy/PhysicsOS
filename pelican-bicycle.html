    <script>
      ;(function () {
        var $ = function (id) {
          return document.getElementById(id)
        }

        var BB = { x: 365, y: 355 } // 中轴
        var R = 34 // 曲柄长度
        var HIP_N = { x: 348, y: 246 } // 近侧髋
        var HIP_F = { x: 337, y: 241 } // 远侧髋
        var L1 = 76,
          L2 = 78 // 大腿 / 小腿

        var REV = 1.25 // 每圈秒数
        var WHEEL_R = 62

        var el = {
          rig: $('rider'),
          head: $('headGroup'),
          scarf: $('scarf'),
          wingFar: $('wingFar'),
          wheelR: $('wheelRear'),
          wheelF: $('wheelFront'),
          legN: $('legNear'),
          legF: $('legFar'),
          footN: $('footNear'),
          footF: $('footFar'),
          crankN: $('crankNear'),
          crankF: $('crankFar'),
          pedalN: $('pedalNear'),
          pedalF: $('pedalFar'),
          clouds: $('cloudLayer'),
          hillsFar: $('hillFarLayer'),
          hillsNear: $('hillNearLayer'),
          dashes: $('dashLayer'),
          chains: document.querySelectorAll('.chainline'),
        }

        // 两骨骼 IK：给定髋与脚，求膝；膝朝前（+x）弯
        function solveIK(hip, foot, l1, l2) {
          var dx = foot.x - hip.x,
            dy = foot.y - hip.y
          var dist = Math.sqrt(dx * dx + dy * dy) || 0.001
          var ux = dx / dist,
            uy = dy / dist
          var d = Math.min(Math.max(dist, Math.abs(l1 - l2) + 1), l1 + l2 - 1)
          var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d)
          var h = Math.sqrt(Math.max(0, l1 * l1 - a * a))
          var bx = hip.x + ux * a,
            by = hip.y + uy * a
          var k1 = { x: bx - uy * h, y: by + ux * h }
          var k2 = { x: bx + uy * h, y: by - ux * h }
          return k1.x > k2.x ? k1 : k2
        }

        function legPath(hip, foot) {
          var knee = solveIK(hip, foot, L1, L2)
          return (
            'M' +
            hip.x.toFixed(1) +
            ' ' +
            hip.y.toFixed(1) +
            ' L' +
            knee.x.toFixed(1) +
            ' ' +
            knee.y.toFixed(1) +
            ' L' +
            foot.x.toFixed(1) +
            ' ' +
            foot.y.toFixed(1)
          )
        }

        function scroll(node, offset, tile) {
          var o = ((offset % tile) + tile) % tile
          node.setAttribute('transform', 'translate(' + (-o).toFixed(2) + ' 0)')
        }

        var start = null
        function frame(now) {
          if (start === null) {
            start = now
          }
          var t = (now - start) / 1000

          var turns = t / REV // 已转圈数
          var wheelDeg = turns * 360
          var theta = turns * Math.PI * 2 // 曲柄角
          var speed = (Math.PI * 2 * WHEEL_R) / REV // 路面速度 px/s

          // 车轮
          el.wheelR.setAttribute('transform', 'rotate(' + (wheelDeg % 360).toFixed(2) + ' 265 338)')
          el.wheelF.setAttribute('transform', 'rotate(' + (wheelDeg % 360).toFixed(2) + ' 525 338)')

          // 踏板位置（近侧在 theta，远侧相差 180°）
          var pedN = { x: BB.x + R * Math.cos(theta), y: BB.y + R * Math.sin(theta) }
          var pedF = { x: BB.x - R * Math.cos(theta), y: BB.y - R * Math.sin(theta) }

          el.crankN.setAttribute('x2', pedN.x.toFixed(1))
          el.crankN.setAttribute('y2', pedN.y.toFixed(1))
          el.crankF.setAttribute('x2', pedF.x.toFixed(1))
          el.crankF.setAttribute('y2', pedF.y.toFixed(1))
          el.pedalN.setAttribute(
            'transform',
            'translate(' + pedN.x.toFixed(1) + ' ' + pedN.y.toFixed(1) + ')',
          )
          el.pedalF.setAttribute(
            'transform',
            'translate(' + pedF.x.toFixed(1) + ' ' + pedF.y.toFixed(1) + ')',
          )

          // 身体起伏（骑行节奏），双腿随之抬高
          var bob = Math.sin(theta) * 3.2
          el.rig.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')')
          var hipN = { x: HIP_N.x, y: HIP_N.y + bob }
          var hipF = { x: HIP_F.x, y: HIP_F.y + bob }

          el.legN.setAttribute('d', legPath(hipN, pedN))
          el.legF.setAttribute('d', legPath(hipF, pedF))
          el.footN.setAttribute(
            'transform',
            'translate(' + pedN.x.toFixed(1) + ' ' + pedN.y.toFixed(1) + ')',
          )
          el.footF.setAttribute(
            'transform',
            'translate(' + pedF.x.toFixed(1) + ' ' + pedF.y.toFixed(1) + ')',
          )

          // 头与围巾的轻微律动
          el.head.setAttribute(
            'transform',
            'rotate(' + (Math.sin(theta) * 1.6).toFixed(2) + ' 405 165)',
          )
          el.scarf.setAttribute(
            'transform',
            'rotate(' + (Math.sin(t * 3.4) * 5).toFixed(2) + ' 408 130)',
          )
          el.wingFar.setAttribute(
            'transform',
            'rotate(' + (Math.sin(theta) * 3.5).toFixed(2) + ' 400 176)',
          )

          // 链条流动
          var dashShift = -t * speed * 0.5
          for (var i = 0; i < el.chains.length; i++) {
            el.chains[i].setAttribute('stroke-dashoffset', dashShift.toFixed(1))
          }

          // 视差滚动
          scroll(el.clouds, t * speed * 0.06, 900)
          scroll(el.hillsFar, t * speed * 0.16, 900)
          scroll(el.hillsNear, t * speed * 0.38, 900)
          scroll(el.dashes, t * speed, 900)

          requestAnimationFrame(frame)
        }

        requestAnimationFrame(frame)
      })()
    </script>
  </body>
</html>
