name: physicsos

services:
  app:
    image: ${PHYSICSOS_APP_IMAGE:-physicsos-app:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.7.0-bookworm-slim}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DSH_HOME: /var/lib/physicsos
      PHYSICSOS_STORAGE_BACKEND: postgres
      PHYSICSOS_STORAGE_SCHEMA: ${PHYSICSOS_STORAGE_SCHEMA:-physicsos}
      PHYSICSOS_SHARED_STATE_BACKEND: redis
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      # auth-host 只从 PHYSICSOS_ADMIN_PASSWORD 种 SUPER_ADMIN；自注册只能得到
      # STUDENT。entrypoint 把 *_FILE materialize 成同名明文变量，文件缺失或为空
      # 直接拒绝启动，因此这里不会出现"没有管理员"的半配置生产实例。
      PHYSICSOS_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      # 题图生成 key；缺失时 paper-host 静默退化为占位说明，所以按 secret 强校验。
      PHYSICOS_IMAGE_API_KEY_FILE: /run/secrets/image_api_key
      # TLS 反代后的真实客户端 IP / Secure cookie 判断。非 secret：Compose 里
      # 显式给出默认空串，未配置时一律不信任转发头。
      PHYSICOS_TRUSTED_PROXIES: ${PHYSICOS_TRUSTED_PROXIES:-}
      # Comma-separated public authorities (host[:port]) this deployment serves.
      # Without it the connection layer treats the domain as untrusted and 403s
      # every privileged method (settings.*, host.*, credentials.*).
      PHYSICOS_TRUSTED_HOSTS: ${PHYSICOS_TRUSTED_HOSTS:-}
      # 以下值与 Dockerfile 的镜像默认值、.env.example 的运维变量保持一致。
      PHYSICSOS_SESSIONS_ROOT: ${PHYSICSOS_SESSIONS_ROOT:-/var/lib/physicsos/sessions}
      PHYSICSOS_PANDOC: ${PHYSICSOS_PANDOC:-/usr/bin/pandoc}
      PHYSICSOS_SOFFICE: ${PHYSICSOS_SOFFICE:-/usr/bin/soffice}
      PHYSICSOS_DATABASE_SSL: ${PHYSICSOS_DATABASE_SSL:-false}
    secrets:
      - database_url
      - redis_url
      - deepseek_api_key
      - admin_password
      - image_api_key
    volumes:
      - app_data:/var/lib/physicsos
    ports:
      - '127.0.0.1:${PHYSICSOS_HTTP_PORT:-3080}:3080'
    healthcheck:
      test:
        - CMD
        - node
        - scripts/healthcheck.mjs
        - http://127.0.0.1:3080/readyz
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: physicsos
      POSTGRES_USER: physicsos
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_password)"
          redis-cli --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

volumes:
  app_data:
  postgres_data:
  redis_data:

secrets:
  postgres_password:
    file: ${PHYSICSOS_POSTGRES_PASSWORD_FILE:-./.env.postgres_password}
  redis_password:
    file: ${PHYSICSOS_REDIS_PASSWORD_FILE:-./.env.redis_password}
  database_url:
    file: ${PHYSICSOS_DATABASE_URL_FILE:-./.env.database_url}
  redis_url:
    file: ${PHYSICSOS_REDIS_URL_FILE:-./.env.redis_url}
  deepseek_api_key:
    file: ${PHYSICSOS_DEEPSEEK_API_KEY_FILE:-./.env.deepseek_api_key}
  admin_password:
    file: ${PHYSICSOS_ADMIN_PASSWORD_FILE:-./.env.admin_password}
  image_api_key:
    file: ${PHYSICOS_IMAGE_API_KEY_FILE:-./.env.image_api_key}
