name: physicsos

services:
  app:
    image: ${PHYSICSOS_APP_IMAGE:-physicsos-app:local}
    # 反代域名必须同时出现在 `--trusted-host`：/api 的浏览器信任栅栏只认
    # CLI 参数（外加同网段 IP 字面量），不读环境变量。Dockerfile 的 CMD 与这里
    # 必须保持一致，只是多了一个 --trusted-host。
    command:
      - node
      - scripts/docker-entrypoint.mjs
      - node
      - vendor/deepseek-harness/apps/cli/lib/bin.js
      - web
      - --patch
      - /app/overlays/harness/files/packages/physicsos/health-host/deployment.patch.yml
      - --port
      - '3080'
      - --trusted-host
      - ${PHYSICOS_TRUSTED_HOSTS:-physics.dongsiwei.com}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.7.0-bookworm-slim}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DSH_HOME: /var/lib/physicsos
      PHYSICSOS_STORAGE_BACKEND: postgres
      PHYSICSOS_STORAGE_SCHEMA: ${PHYSICSOS_STORAGE_SCHEMA:-physicsos}
      PHYSICSOS_SHARED_STATE_BACKEND: redis
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      # 模型链路：base 组合的 agent-default-model 是 deepseek-official，
      # 适配器默认打 https://api.deepseek.com，这里把它指向实际可用的
      # OpenAI 兼容网关。只允许通过本变量覆盖端点，key 仍然只经 secret 文件注入。
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.fengshao1227.com/v1}
      # 该 key 必须对上面的 DEEPSEEK_BASE_URL 有效；部署脚本只检查文件非空，
      # 所以换网关时必须同步换这个 secret，否则真实回合会以 AUTH 401 失败。
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      # auth-host 只从 PHYSICSOS_ADMIN_PASSWORD 种 SUPER_ADMIN；自注册只能得到
      # STUDENT。entrypoint 把 *_FILE materialize 成同名明文变量，文件缺失或为空
      # 直接拒绝启动，因此这里不会出现"没有管理员"的半配置生产实例。
      PHYSICSOS_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      # 题图生成 key；缺失时 paper-host 静默退化为占位说明，所以按 secret 强校验。
      PHYSICOS_IMAGE_API_KEY_FILE: /run/secrets/image_api_key
      # TLS 反代后的真实客户端 IP / Secure cookie 判断。非 secret：Compose 里
      # 显式给出默认空串，未配置时一律不信任转发头。
      PHYSICOS_TRUSTED_PROXIES: ${PHYSICOS_TRUSTED_PROXIES:-}
      # Public authority (host[:port]) this deployment serves; the same value is
      # passed to the CLI as --trusted-host above. Without it the connection
      # layer treats the domain as untrusted and 403s every /api request.
      PHYSICOS_TRUSTED_HOSTS: ${PHYSICOS_TRUSTED_HOSTS:-physics.dongsiwei.com}
      # 公测控量开关：open(默认) / invite(必须邀请码) / closed(关闭注册)。
      # 取值非法时 auth-host 启动即失败，不会静默退回开放注册。
      PHYSICSOS_REGISTRATION_MODE: ${PHYSICSOS_REGISTRATION_MODE:-open}
      # 以下值与 Dockerfile 的镜像默认值、.env.example 的运维变量保持一致。
      PHYSICSOS_SESSIONS_ROOT: ${PHYSICSOS_SESSIONS_ROOT:-/var/lib/physicsos/sessions}
      PHYSICSOS_PANDOC: ${PHYSICSOS_PANDOC:-/usr/bin/pandoc}
      PHYSICSOS_SOFFICE: ${PHYSICSOS_SOFFICE:-/usr/bin/soffice}
      PHYSICSOS_DATABASE_SSL: ${PHYSICSOS_DATABASE_SSL:-false}
    secrets:
      - database_url
      - redis_url
      - deepseek_api_key
      - admin_password
      - image_api_key
    volumes:
      - app_data:/var/lib/physicsos
    ports:
      - '127.0.0.1:${PHYSICSOS_HTTP_PORT:-3080}:3080'
    healthcheck:
      test:
        - CMD
        - node
        - scripts/healthcheck.mjs
        - http://127.0.0.1:3080/readyz
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: physicsos
      POSTGRES_USER: physicsos
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_password)"
          redis-cli --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

volumes:
  app_data:
  postgres_data:
  redis_data:

# File-based secrets are bind-mounted as-is: Docker Compose accepts
# `uid`/`gid`/`mode` on a service secret but ignores them for `file:` secrets
# (it warns "secrets `uid`, `gid` and `mode` are not supported, they will be
# ignored"), so those keys would document a guarantee that does not exist.
# The invariant lives on the host files instead, enforced by
# `scripts/deploy/secure-secrets.sh` on every deploy:
#   root:<physicsos gid> 0440  — readable by the app user (uid/gid 999) and by
#   root, unreadable by every other identity (e.g. `exec -u 1000`).
# Never relax these files back to 0644/0444: a world-readable admin password or
# model key is readable by any process in the container, not just the agent.
secrets:
  postgres_password:
    file: ${PHYSICSOS_POSTGRES_PASSWORD_FILE:-./.env.postgres_password}
  redis_password:
    file: ${PHYSICSOS_REDIS_PASSWORD_FILE:-./.env.redis_password}
  database_url:
    file: ${PHYSICSOS_DATABASE_URL_FILE:-./.env.database_url}
  redis_url:
    file: ${PHYSICSOS_REDIS_URL_FILE:-./.env.redis_url}
  deepseek_api_key:
    file: ${PHYSICSOS_DEEPSEEK_API_KEY_FILE:-./.env.deepseek_api_key}
  admin_password:
    file: ${PHYSICSOS_ADMIN_PASSWORD_FILE:-./.env.admin_password}
  image_api_key:
    file: ${PHYSICOS_IMAGE_API_KEY_FILE:-./.env.image_api_key}
