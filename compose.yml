name: physicsos

# Docker Compose applies uid/gid/mode to managed secrets. File-backed secrets
# are bind-mounted from these files; the host-side `secure-secrets.sh` is the
# authoritative enforcement layer and mirrors this 999:999/0400 declaration.
x-secret-mount: &secret-mount
  uid: '999'
  gid: '999'
  mode: '0400'

services:
  app:
    image: ${PHYSICSOS_APP_IMAGE:-physicsos-app:local}
    # 反代域名必须同时出现在 `--trusted-host`：/api 的浏览器信任栅栏只认
    # CLI 参数（外加同网段 IP 字面量），不读环境变量。0.1.7 起同一份列表
    # 还是「文档闸门」的放行名单——上游默认给每个文档发一张 per-process
    # launch token，反代后的公网域名拿不到、也留不住，必须由部署声明自己的
    # 权威域名来放行（见 docs/13-DEPLOYMENT-OPERATIONS.md 第 4 节）。
    # `--no-open` 是服务器侧的固定姿势：容器里没有浏览器，默认会 spawn 一个
    # 必然失败的 opener，只在 stderr 留一行告警。Dockerfile 的 CMD 是镜像
    # 默认值（交互式 `docker run` 仍可自动开浏览器），compose 在此之上加了
    # --no-open 与 --trusted-host。
    command:
      - node
      - scripts/docker-entrypoint.mjs
      - node
      - vendor/deepseek-harness/apps/cli/lib/bin.js
      - web
      - --patch
      - /app/overlays/harness/files/packages/physicsos/health-host/deployment.patch.yml
      - --port
      - '3080'
      - --no-open
      - --trusted-host
      - ${PHYSICOS_TRUSTED_HOSTS:-physics.dongsiwei.com}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.7.0-bookworm-slim}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DSH_HOME: /var/lib/physicsos
      PHYSICSOS_STORAGE_BACKEND: postgres
      PHYSICSOS_STORAGE_SCHEMA: ${PHYSICSOS_STORAGE_SCHEMA:-physicsos}
      PHYSICSOS_SHARED_STATE_BACKEND: redis
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      # 模型链路：Harness 的 DeepSeek 适配器指向容器内的平台模型池代理
      # （model-pool-host，默认 127.0.0.1:38972）。通道与 key 在后台「模型通道」
      # 维护，key 失效自动切下一个；下面两个变量只负责「池子为空时」播种的兜底
      # 通道，即使后台从没配置过，模型回合也不会断。
      DEEPSEEK_BASE_URL: http://127.0.0.1:${PHYSICSOS_MODEL_POOL_PORT:-38972}/v1
      PHYSICSOS_MODEL_POOL_PORT: ${PHYSICSOS_MODEL_POOL_PORT:-38972}
      PHYSICSOS_MODEL_FALLBACK_BASE_URL: ${PHYSICSOS_MODEL_FALLBACK_BASE_URL:-https://api.fengshao1227.com/v1}
      PHYSICSOS_MODEL_FALLBACK_API_KEY_FILE: /run/secrets/deepseek_api_key
      # 加密主密钥：模型通道里的 key 只用它的派生密钥加密落库。它必须长期稳定，
      # 换掉等于所有已存 key 都要重新录入（解密失败 fail-closed，不会静默用错 key）。
      PHYSICSOS_MODEL_POOL_SECRET_FILE: /run/secrets/model_pool_secret
      # Harness 连接校验仍要求这个非空；代理不再直接使用它，但池子为空时它会
      # 被播种成平台兜底通道的第一个 key。
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      # auth-host 只从 PHYSICSOS_ADMIN_PASSWORD 种 SUPER_ADMIN；自注册只能得到
      # STUDENT。entrypoint 把 *_FILE materialize 成同名明文变量，文件缺失或为空
      # 直接拒绝启动，因此这里不会出现"没有管理员"的半配置生产实例。
      PHYSICSOS_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      # 题图生成 key；缺失时 paper-host 静默退化为占位说明，所以按 secret 强校验。
      PHYSICOS_IMAGE_API_KEY_FILE: /run/secrets/image_api_key
      # TLS 反代后的真实客户端 IP / Secure cookie 判断。非 secret：Compose 里
      # 显式给出默认空串，未配置时一律不信任转发头。
      PHYSICOS_TRUSTED_PROXIES: ${PHYSICOS_TRUSTED_PROXIES:-}
      # Public authority (host[:port]) this deployment serves; the same value is
      # passed to the CLI as --trusted-host above. Without it the connection
      # layer treats the domain as untrusted and 403s every /api request.
      PHYSICOS_TRUSTED_HOSTS: ${PHYSICOS_TRUSTED_HOSTS:-physics.dongsiwei.com}
      # 公测控量开关：open(默认) / invite(必须邀请码) / closed(关闭注册)。
      # 取值非法时 auth-host 启动即失败，不会静默退回开放注册。
      PHYSICSOS_REGISTRATION_MODE: ${PHYSICSOS_REGISTRATION_MODE:-open}
      # 以下值与 Dockerfile 的镜像默认值、.env.example 的运维变量保持一致。
      PHYSICSOS_SESSIONS_ROOT: ${PHYSICSOS_SESSIONS_ROOT:-/var/lib/physicsos/sessions}
      PHYSICSOS_PANDOC: ${PHYSICSOS_PANDOC:-/usr/bin/pandoc}
      PHYSICSOS_SOFFICE: ${PHYSICSOS_SOFFICE:-/usr/bin/soffice}
      PHYSICSOS_DATABASE_SSL: ${PHYSICSOS_DATABASE_SSL:-false}
    secrets:
      - source: database_url
        target: database_url
        <<: *secret-mount
      - source: redis_url
        target: redis_url
        <<: *secret-mount
      - source: deepseek_api_key
        target: deepseek_api_key
        <<: *secret-mount
      - source: model_pool_secret
        target: model_pool_secret
        <<: *secret-mount
      - source: admin_password
        target: admin_password
        <<: *secret-mount
      - source: image_api_key
        target: image_api_key
        <<: *secret-mount
    volumes:
      - app_data:/var/lib/physicsos
    ports:
      - '127.0.0.1:${PHYSICSOS_HTTP_PORT:-3080}:3080'
    healthcheck:
      test:
        - CMD
        - node
        - scripts/healthcheck.mjs
        - http://127.0.0.1:3080/readyz
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: physicsos
      POSTGRES_USER: physicsos
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: postgres_password
        target: postgres_password
        <<: *secret-mount
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - source: redis_password
        target: redis_password
        <<: *secret-mount
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_password)"
          redis-cli --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

volumes:
  app_data:
  postgres_data:
  redis_data:

# File-backed secrets are bind-mounted from the source files. Docker Compose may
# ignore uid/gid/mode for `file:` secrets, so `scripts/deploy/secure-secrets.sh`
# enforces the same invariant directly on the host on every deploy:
#   physicsos:physicsos 0400 — readable by the app, Postgres and Redis
#   entrypoints (all run as uid/gid 999), and by root; unreadable by every other
#   identity (for example `docker compose exec -u 1000:1000 app`).
# Never relax these files back to 0644/0444: a world-readable admin password or
# model key is readable by any process in the container, not just the agent.
secrets:
  postgres_password:
    file: ${PHYSICSOS_POSTGRES_PASSWORD_FILE:-./.env.postgres_password}
  redis_password:
    file: ${PHYSICSOS_REDIS_PASSWORD_FILE:-./.env.redis_password}
  database_url:
    file: ${PHYSICSOS_DATABASE_URL_FILE:-./.env.database_url}
  redis_url:
    file: ${PHYSICSOS_REDIS_URL_FILE:-./.env.redis_url}
  deepseek_api_key:
    file: ${PHYSICSOS_DEEPSEEK_API_KEY_FILE:-./.env.deepseek_api_key}
  model_pool_secret:
    file: ${PHYSICSOS_MODEL_POOL_SECRET_FILE:-./.env.model_pool_secret}
  admin_password:
    file: ${PHYSICSOS_ADMIN_PASSWORD_FILE:-./.env.admin_password}
  image_api_key:
    file: ${PHYSICOS_IMAGE_API_KEY_FILE:-./.env.image_api_key}
