name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit or release ref to verify
        required: false
        type: string
        default: ''
    outputs:
      commit:
        description: Commit that passed verification
        value: ${{ jobs.verify.outputs.commit }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      PHYSICSOS_TEST_POSTGRES_URL: postgresql://postgres:physicsos-ci@127.0.0.1:5432/physicsos_test
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: physicsos-ci
          POSTGRES_DB: physicsos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d physicsos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}

      - name: Record verified revision
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.7.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pinned pnpm versions
        run: |
          root_pnpm="$(pnpm --version)"
          vendor_pnpm="$(pnpm -C vendor/deepseek-harness --version)"
          test "$root_pnpm" = "11.9.0"
          test "$vendor_pnpm" = "11.7.0"
          echo "root pnpm: $root_pnpm"
          echo "vendor pnpm: $vendor_pnpm"

      - name: Self-test commit message policy
        run: node scripts/ci/check-commit-message.mjs --self-test

      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm run ci:commit-message

      - name: Apply Harness overlay
        run: node scripts/overlay/harness-overlay.mjs apply

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Harness
        run: pnpm -C vendor/deepseek-harness install --frozen-lockfile --ignore-scripts

      - name: Verify dependency isolation and overlay
        run: |
          pnpm run verify:dependencies
          pnpm run verify:overlay

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Test health host
        run: >-
          pnpm -C vendor/deepseek-harness exec vitest run
          --config ../../overlays/harness/files/packages/physicsos/health-host/vitest.config.ts

      - name: Build Harness libraries
        run: pnpm -C vendor/deepseek-harness run build:lib

      - name: Format
        run: >-
          pnpm exec prettier --check
          .github/dependabot.yml
          .github/workflows/ci.yml
          .github/workflows/codeql.yml
          .github/workflows/dependency-review.yml
          .github/workflows/release.yml
          compose.yml
          docs/13-DEPLOYMENT-OPERATIONS.md
          scripts/ci
          scripts/healthcheck.mjs
          overlays/harness/files/packages/physicsos/health-host

      - name: Build health host
        run: pnpm -C vendor/deepseek-harness --filter @deepseek-ai/dsh-health-host run bundle

      - name: Validate desktop release config
        run: pnpm run desktop:config

      - name: Lint health host
        run: >-
          pnpm exec eslint
          overlays/harness/files/packages/physicsos/health-host/src
          overlays/harness/files/packages/physicsos/health-host/tests
          scripts/healthcheck.mjs

      - name: Typecheck, lint, and test
        run: pnpm run test:ci

      - name: Build
        run: pnpm build

      - name: Verify patched upstream and PostgreSQL integration
        run: |
          pnpm run test:upstream
          pnpm run test:storage
          pnpm run test:headless

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify browser journeys
        run: pnpm run test:acceptance
