name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.7.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pinned pnpm versions
        run: |
          root_pnpm="$(pnpm --version)"
          vendor_pnpm="$(pnpm -C vendor/deepseek-harness --version)"
          test "$root_pnpm" = "11.9.0"
          test "$vendor_pnpm" = "11.7.0"
          echo "root pnpm: $root_pnpm"
          echo "vendor pnpm: $vendor_pnpm"

      - name: Self-test commit message policy
        run: node scripts/ci/check-commit-message.mjs --self-test

      - name: Self-test secret-leak gate
        run: node packages/image-generation/src/scan-cli.ts --self-test

      - name: Scan for leaked credentials
        run: node packages/image-generation/src/scan-cli.ts

      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm run ci:commit-message

      - name: Apply Harness overlay
        run: node scripts/overlay/harness-overlay.mjs apply

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Harness
        run: pnpm -C vendor/deepseek-harness install --frozen-lockfile --ignore-scripts

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Test health host
        run: >-
          pnpm -C vendor/deepseek-harness exec vitest run
          --config ../../overlays/harness/files/packages/physicsos/health-host/vitest.config.ts

      - name: Build Harness libraries
        run: pnpm -C vendor/deepseek-harness run build:lib

      - name: Format
        run: >-
          pnpm exec prettier --check
          .github/dependabot.yml
          .github/workflows/ci.yml
          .github/workflows/codeql.yml
          .github/workflows/dependency-review.yml
          .github/workflows/release.yml
          compose.yml
          docs/13-DEPLOYMENT-OPERATIONS.md
          scripts/ci
          scripts/healthcheck.mjs
          overlays/harness/files/packages/physicsos/health-host

      - name: Build health host
        run: pnpm -C vendor/deepseek-harness --filter @deepseek-ai/dsh-health-host run bundle

      - name: Validate desktop release config
        run: pnpm run desktop:config

      - name: Lint health host
        run: >-
          pnpm exec eslint
          overlays/harness/files/packages/physicsos/health-host/src
          overlays/harness/files/packages/physicsos/health-host/tests
          scripts/healthcheck.mjs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test core
        run: pnpm run test:core

      - name: Test web
        run: pnpm run test:web

      - name: Test agent
        run: pnpm run test:agent

      - name: Test deploy
        run: pnpm run test:deploy

      - name: Test desktop
        run: |
          set +e
          pnpm run test:desktop > /tmp/desktop-test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            awk '/AssertionError|timed out|did not become ready|Error \(|\\[webHost\\]|\\[terminal\\]/{hit=1} hit{print; n++} n>13{exit}' \
              /tmp/desktop-test.log | while IFS= read -r line; do echo "::error::desktop: $line"; done
            tail -80 /tmp/desktop-test.log
          fi
          exit "$code"

      - name: Build
        run: pnpm build
