name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.7.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply Harness overlay
        run: node scripts/overlay/harness-overlay.mjs apply

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Harness
        run: pnpm -C vendor/deepseek-harness install --frozen-lockfile --ignore-scripts

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Test health host
        run: >-
          pnpm -C vendor/deepseek-harness exec vitest run
          --config ../../overlays/harness/files/packages/physicsos/health-host/vitest.config.ts

      - name: Build Harness libraries
        run: pnpm -C vendor/deepseek-harness run build:lib

      - name: Format
        run: >-
          pnpm exec prettier --check
          .github/workflows/ci.yml
          compose.yml
          docs/13-DEPLOYMENT-OPERATIONS.md
          scripts/healthcheck.mjs
          overlays/harness/files/packages/physicsos/health-host

      - name: Build health host
        run: pnpm exec tsc -p overlays/harness/files/packages/physicsos/health-host/tsconfig.json

      - name: Lint health host
        run: >-
          pnpm exec eslint
          overlays/harness/files/packages/physicsos/health-host/src
          overlays/harness/files/packages/physicsos/health-host/tests
          scripts/healthcheck.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
