name: Desktop Release

# Optional repository secrets:
# - PHYSICSOS_DESKTOP_UPDATE_PUBKEY
# - PHYSICSOS_DESKTOP_UPDATE_ENDPOINT
# - TAURI_SIGNING_PRIVATE_KEY
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# macOS code signing/notarization:
# - APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
# - APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
# Windows code signing:
# - WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
# - WINDOWS_CERTIFICATE_THUMBPRINT
#
# Any missing signing secret selects an unsigned build. Updater artifacts are
# disabled unless the updater public key, endpoint, and private key are all set.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: PhysicsOS-macOS-arm64
          - name: macOS x86_64
            runner: macos-15-intel
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: PhysicsOS-macOS-x86_64
          - name: Windows x86_64
            runner: windows-2025
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: PhysicsOS-Windows-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-${{ runner.os }}-${{ matrix.target }}-

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm -C vendor/deepseek-harness install --frozen-lockfile --ignore-scripts

      - name: Verify pnpm versions
        shell: bash
        run: |
          test "$(pnpm --version)" = "11.9.0"
          test "$(pnpm -C vendor/deepseek-harness --version)" = "11.7.0"

      - name: Run desktop packaging tests
        shell: bash
        run: node --test scripts/desktop/*.test.mjs

      - name: Run Rust checks
        shell: bash
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build installer
        shell: bash
        env:
          PHYSICSOS_DESKTOP_UPDATE_PUBKEY: ${{ secrets.PHYSICSOS_DESKTOP_UPDATE_PUBKEY }}
          PHYSICSOS_DESKTOP_UPDATE_ENDPOINT: ${{ secrets.PHYSICSOS_DESKTOP_UPDATE_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          build_args=(
            --target "${{ matrix.target }}"
            --bundles "${{ matrix.bundles }}"
          )

          if [[ -z "$PHYSICSOS_DESKTOP_UPDATE_PUBKEY" ||
                -z "$PHYSICSOS_DESKTOP_UPDATE_ENDPOINT" ||
                -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            build_args+=(--no-updater-signing)
          fi

          if [[ "${{ matrix.platform }}" == "darwin" ]]; then
            if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
              build_args+=(--no-sign)
            fi
          elif [[ -z "$WINDOWS_CERTIFICATE" && -z "$WINDOWS_CERTIFICATE_THUMBPRINT" ]]; then
            build_args+=(--no-sign)
          fi

          pnpm --dir apps/desktop run build:release -- "${build_args[@]}"

      - name: Upload macOS installers
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg.sig

      - name: Upload Windows installers
        if: matrix.platform == 'win32'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
