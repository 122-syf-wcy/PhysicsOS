</style></head><body><div class="scheme-bar"><b>方案一：独立 HTML</b><span class="scheme-subtitle">每个实验都是一个可单独打开的文件</span><a href="/">返回三个方案对比 ↗</a></div><header class="standalone-header"><div class="brand"><span class="brand-icon">◇</span>Physics<span>OS</span></div><nav class="single-nav" aria-label="独立实验文件"><a class="active" href="convex-lens.html">凸透镜</a><a class="" href="plane-mirror.html">平面镜</a></nav><div class="header-nav"><a class="secondary" href="convex-lens.html" download>↓ 下载本页 HTML</a></div></header><main class="standalone-content"><div id="experiment"></div></main><script>class LensModel extends EventTarget {
 constructor(kind='lens'){super();this.kind=kind;this.u=30;this.f=10;this.d=15;this.h=6;this.rays=true;this.image=true;this.records=[];}
 get result(){
  if(this.kind==='mirror')return {v:-this.u,m:1,lit:false,nature:'正立 · 等大 · 虚像',zone:'像物等距',atFocus:false,height:this.h};
  const atFocus=Math.abs(this.u-this.f)<.025;const v=atFocus?null:this.u*this.f/(this.u-this.f);const m=v===null?null:-v/this.u;
  const lit=v!==null&&v>0&&Math.abs(this.d-v)<.7;const size=m===null?'':Math.abs(Math.abs(m)-1)<.02?'等大':Math.abs(m)>1?'放大':'缩小';
  return {v,m,lit,nature:atFocus?'不成像':`${v<0?'正立':'倒立'} · ${size} · ${v<0?'虚像':'实像'}`,zone:atFocus?'u = f':Math.abs(this.u-2*this.f)<.025?'u = 2f':this.u>2*this.f?'u > 2f':this.u>this.f?'f < u < 2f':'u < f',atFocus,height:m===null?null:this.h*m};
 }
 set(key,value){if(['u','f','d'].includes(key)){const n=Number(value);if(!Number.isFinite(n))return;this[key]=Math.max(key==='f'?5:5,Math.min(key==='u'?60:key==='f'?20:80,n));}else if(['rays','image'].includes(key))this[key]=Boolean(value);this.dispatchEvent(new Event('change'));}
 preset(ratio){this.u=Math.max(5,Math.min(60,this.f*ratio));this.dispatchEvent(new Event('change'));}
 focus(){const {v}=this.result;if(v!==null&&v>0&&v<=80){this.d=v;this.dispatchEvent(new Event('change'));}}
 reset(){this.u=30;this.f=10;this.d=15;this.rays=true;this.image=true;this.dispatchEvent(new Event('change'));}
 record(){if(this.records.length>=50)return;this.records.push({u:this.u,f:this.f,d:this.d,...this.result});this.dispatchEvent(new Event('change'));}
 restore(data){if(!data||typeof data!=='object')return;for(const k of ['u','f','d'])if(Number.isFinite(data[k]))this[k]=Math.max(5,Math.min(k==='f'?20:k==='u'?60:80,data[k]));if(Array.isArray(data.records))this.records=data.records.filter(r=>r&&Number.isFinite(r.u)&&Number.isFinite(r.f)&&(r.v===null||Number.isFinite(r.v))&&typeof r.nature==='string').slice(-50);}
 serialize(){return {u:this.u,f:this.f,d:this.d,records:this.records};}
}
const fmt=v=>v===null?'∞':Number(v.toFixed(1)).toString();
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));


const param=(key,title,min,max)=>`<div class="parameter"><div class="parameter-top"><label for="param-${key}">${title} <i>${key}</i></label><div><input id="number-${key}" data-number="${key}" type="text" inputmode="decimal" aria-label="${title}数值"><span>cm</span></div></div><input id="param-${key}" type="range" min="${min}" max="${max}" step="0.5" data-param="${key}" aria-label="${title}"><div class="range-ends"><span>${min} cm</span><span>${max} cm</span></div></div>`;
function recordTable(model){return model.records.length?`<div class="table-wrap"><table aria-label="实验记录"><thead><tr><th>记录</th><th>物距 u</th><th>${model.kind==='mirror'?'像物关系':'焦距 f'}</th><th>像距 |v|</th><th>像的性质</th></tr></thead><tbody>${model.records.map((r,i)=>`<tr><td>${i+1}</td><td>${fmt(r.u)} cm</td><td>${model.kind==='mirror'?'像物等距':fmt(r.f)+' cm'}</td><td>${fmt(r.v===null?null:Math.abs(r.v))} cm</td><td>${escapeHtml(r.nature)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-records">调整物体与光屏，记录几组数据，再比较成像规律。</div>';}
function exportRecords(model){if(!model.records.length)return;const rows=[['次数','物距/cm','焦距/cm','像距绝对值/cm','像的性质'],...model.records.map((r,i)=>[i+1,r.u,model.kind==='mirror'?'—':r.f,fmt(r.v===null?null:Math.abs(r.v)),r.nature])];const blob=new Blob(['\ufeff'+rows.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='实验记录.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

/** Pure view shared by the standalone document and React route hosts. */
function mountLab(root,model,{allow3D=false}={}){
 const mirror=model.kind==='mirror';const name=mirror?'平面镜成像':'凸透镜成像规律';let mode='2d',live=true,bench=null,loadVersion=0;const cleanups=[];
 const qs=s=>root.querySelector(s);const all=s=>root.querySelectorAll(s);
