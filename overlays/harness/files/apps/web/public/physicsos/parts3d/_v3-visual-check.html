<!doctype html>
<meta charset="utf-8">
<title>v3 sprite visual check</title>
<style>
  body { margin: 0; background: #e8edf2; font-family: -apple-system, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px; }
  figure { margin: 0; background: #fff; border: 1px solid #c9d4de; border-radius: 8px; padding: 8px; text-align: center; }
  img { width: 100%; display: block; background:
        repeating-conic-gradient(#f3f6f9 0% 25%, #dde5ec 0% 50%) 0 0 / 24px 24px; }
  figcaption { font-size: 13px; color: #33475b; padding-top: 6px; }
</style>
<div class="grid">
  <figure><img src="studio-v3/cell-aa.png"><figcaption>cell-aa</figcaption></figure>
  <figure><img src="studio-v3/battery-pack.png"><figcaption>battery-pack</figcaption></figure>
  <figure><img src="studio-v3/supply-dc.png"><figcaption>supply-dc</figcaption></figure>
  <figure><img src="studio-v3/switch-button.png"><figcaption>switch-button</figcaption></figure>
  <figure><img src="studio-v3/resistor-5.png"><figcaption>resistor-5</figcaption></figure>
  <figure><img src="studio-v3/resistor-50.png"><figcaption>resistor-50</figcaption></figure>
  <figure><img src="studio-v3/rheostat-50.png"><figcaption>rheostat-50</figcaption></figure>
  <figure><img src="studio-v2/battery.png"><figcaption>v2 battery (reference)</figcaption></figure>
</div>
