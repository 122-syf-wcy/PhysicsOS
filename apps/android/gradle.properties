# A single build must fit alongside services on the 4 GiB production host.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.caching=true
# Signing credentials must not be serialized into a configuration-cache entry.
org.gradle.configuration-cache=false
org.gradle.java.installations.auto-download=false
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
kotlin.incremental=true
ksp.useKSP2=true
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.sdkDownload=false
